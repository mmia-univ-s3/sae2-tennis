{% extends "base.html" %}

{% block main %}
    <h1>Ajout d'un sport</h1>
    <form action="{{ url_for('tarifications_sport_ajout') }}"
          method="post"
          class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="nom" class="col-sm-2 control-label">{{ form.nom.label }}</label>
            <div class="col-sm-10">
                {{ form.nom(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="commentaire" class="col-sm-2 control-label">{{ form.commentaire.label }}</label>
            <div class="col-sm-10">
                {{ form.commentaire(size=50, class_="form-control", min=0) }}
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Valider" class="btn btn-success">
                <a href="{{ url_for('tarifications_sport_ajout') }}"
                   class="btn btn-secondary">Retour</a>
            </div>
        </div>
    </form>
{% endblock %}
