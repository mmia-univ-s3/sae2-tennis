{% extends "base.html" %}

{% block main %}
    <h1>Suppression d'un sport</h1>
    <p>Vous allez supprimer un sport. Ce sport ne sera plus visible sur le site.
        Voulez-vous continuer ?</p>
    <form action="{{ url_for('tarifications_sport_delete', id_sport=id_sport) }}" method="post"
          class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Supprimer" class="btn btn-danger">
                <a href="{{ url_for('tarifications') }}" class="btn btn-secondary">Annuler</a>
            </div>
        </div>
    </form>
{% endblock %}
