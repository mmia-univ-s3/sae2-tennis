{% extends "base.html" %}

{% block main %}
    <h1>Ajout d'un partenaire</h1>
    <form action="{{ url_for('partenaire_create') }}" method="post" class="form-horizontal mb-3"
          enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="nom" class="col-sm-2 control-label">{{ form.nom.label }}</label>
            <div class="col-sm-10">
                {{ form.nom(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="logo" class="col-sm-2 control-label">{{ form.logo.label }}</label>
            <div class="col-sm-10">
                {{ form.logo(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Valider" class="btn btn-success">
                <a href="{{ url_for('partenaires') }}" class="btn btn-secondary">Annuler</a>
            </div>
        </div>
    </form>
{% endblock %}
