{% extends "base.html" %}

{% block main %}
    <h1>Gestion des utilisateurs</h1>

    <ul class="list-group">
        {% for user in users %}
            <li class="list-group-item"
                style="display: grid; grid-template-columns: 1fr max-content">
                <div style="display: flex; align-items: center">
                    <div>
                        {{ user.login }}
                        {% if current_user.login == user.login %}
                            <b>(vous)</b>
                        {% endif %}
                    </div>
                </div>
                <div class="btn-group">
                    <a title="Réinitialiser le mot de passe"
                       href="/utilisateurs/{{ user.login }}/reset/"
                       class="btn btn-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                             viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round"
                             class="lucide lucide-rotate-ccw-key-icon lucide-rotate-ccw-key">
                            <path d="m14.5 9.5 1 1"/>
                            <path d="m15.5 8.5-4 4"/>
                            <path d="M3 12a9 9 0 1 0 9-9 9.74 9.74 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                            <circle cx="10" cy="14" r="2"/>
                        </svg>
                    </a>
                    <a title="Supprimer" href="/utilisateurs/{{ user.login }}/delete/"
                       class="btn btn-secondary {% if current_user.login == user.login %}disabled{% endif %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                             viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round"
                             stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash">
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                            <path d="M3 6h18"/>
                            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </a>
                </div>
            </li>
        {% endfor %}
    </ul>

    <div class="mt-2">
        <a href="/utilisateurs/create" class="btn btn-primary">Ajouter un nouvel utilisateur</a>
    </div>
{% endblock %}
