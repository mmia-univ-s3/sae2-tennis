{% extends "base.html" %}

{% block main %}
    <h1>Ajout d'une catégorie</h1>
    <form action="{{ url_for('tarifications_categorie_ajout') }}" method="post"
          class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="intituleCat"
                   class="col-sm-2 control-label">{{ form.intitule.label }}</label>
            <div class="col-sm-10">
                {{ form.intitule(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="sport" class="col-sm-2 control-label">{{ form.sport.label }}</label>
            <div class="col-sm-10">
                {{ form.sport(class_="form-select") }}
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Valider" class="btn btn-success">
                <a href="{{ url_for('tarifications') }}" class="btn btn-secondary">Retour</a>
            </div>
        </div>
    </form>
{% endblock %}
