{% extends "base.html" %}

{% block main %}
    <h1>Suppression d'un partenaire</h1>
    <form action="{{ url_for('partenaire_delete', id_p=parte.id) }}" method="post"
          class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <p>Vous allez supprimer le partenaire <b>{{ parte.nom }}</b>. Ce partenaire ne sera plus
            visible
            sur le site. Voulez-vous continuer ?</p>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Supprimer" class="btn btn-danger">
                <a href="{{ url_for('partenaires') }}" class="btn btn-secondary">Annuler</a>
            </div>
        </div>
    </form>
{% endblock %}
