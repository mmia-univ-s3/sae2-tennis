{% extends "base.html" %}

{% block main %}
    <h1>Suppression d'un partenaire</h1>
    <form action="{{ url_for('article_delete', id_article=art.id) }}" method="post" class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <p>Vous allez supprimer l'article <b>{{ art.titre }}</b>. Cet article ne sera plus visible sur le site. Voulez-vous continuer ?</p>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Supprimer" class="btn btn-danger">
                <a href="{{ url_for('articles') }}" class="btn btn-secondary">Annuler</a>
            </div>
        </div>
    </form>
{% endblock %}
