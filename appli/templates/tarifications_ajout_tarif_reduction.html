{% extends "base.html" %}

{% block main %}
    <body>
        <h1>Ajout d'une réduction</h1>
    <form action="{{ url_for('tarifications_ajout_tarif_reduction', id_cat=id_cat) }}" method="post" class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="intituleT" class="col-sm-2 control-label">{{ form.intituleT.label }}</label>
            <div class="col-sm-10">
                {{ form.intituleT(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="taux" class="col-sm-2 control-label">{{ form.taux.label }}</label>
            <div class="col-sm-10">
                {{ form.taux(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="estCumulable" class="col-sm-2 control-label">{{ form.estCumulable.label }}</label>
            <div class="col-sm-10">
                {{ form.estCumulable(size=50) }}
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Valider" class="btn btn-success">
                <a href="{{ url_for('tarifications_tarif_ajout', id_cat=id_cat) }}" class="btn btn-secondary">Retour</a>
            </div>
        </div>
    </form>
    </body>
{% endblock %}
