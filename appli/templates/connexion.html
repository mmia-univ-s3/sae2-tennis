{% extends "base.html" %}

{% block main %}
      <h1>Se connecter</h1>

      <form action="{{ url_for('connexion') }}" method="post" class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
          <label for="login" class="col-sm-2 control-label">{{ form.login.label }}</label>
          <div class="col-sm-10">
            {{ form.login(size=50, class_="form-control") }}
          </div>
        </div>
        <div class="form-group mb-3">
          <label for="password" class="col-sm-2 control-label">{{ form.password.label }}</label>
          <div class="col-sm-10">
            {{ form.password(size=50, class_="form-control") }}
          </div>
        </div>
        <div class="form-group">
          <div class="col-sm-offset-2 col-sm-10">
            <input type="submit" value="Se connecter" class="btn btn-success">
          </div>
        </div>
      </form>
{% endblock %}
