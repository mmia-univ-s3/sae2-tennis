{% extends "base.html" %}

{% block main %}
    <h1>Ajout d'un fichier</h1>
    <form action="{{ url_for('fichiers_create') }}" method="post" class="form-horizontal mb-3"
          enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="image" class="col-sm-10 control-label">{{ form.image.label }}</label>
            <div class="col-sm-10">
                {{ form.image(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="largeur" class="col-sm-2 control-label">{{ form.largeur.label }}</label>
            <div class="col-sm-10">
                {{ form.largeur(size=50, class_="form-control", min=10, max=3000) }}
            </div>
        </div>
        <div class="form-group mb-2">
            <label for="description" class="col-sm-10 control-label">{{ form.description.label }}</label>
            <div class="col-sm-10">
                {{ form.description(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <div class="form-group mb-3 mt-3">
                <div class="col-sm-offset-2 col-sm-10">
                    <input type="submit" value="Téléverser" class="btn btn-success">
                    <a href="{{ url_for('fichiers_list') }}" class="btn btn-secondary">Annuler</a>
                </div>
            </div>
        </div>
    </form>
{% endblock %}
