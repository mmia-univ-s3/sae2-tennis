{% extends "base.html" %}

{% block main %}
    <h1>Modification du tarif de {{ reservation.intitule }}</h1>
    <form action="{{ url_for('tarifications_reservations_update', id_tarif=reservation.id) }}"
          method="post" class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="intitule" class="col-sm-2 control-label">{{ form.intitule.label }}</label>
            <div class="col-sm-10">
                {{ form.intitule(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="montant" class="col-sm-2 control-label">{{ form.montant.label }}</label>
            <div class="col-sm-10">
                {{ form.montant(size=50, class_="form-control", min=0) }}
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Valider" class="btn btn-success">
                <a href="{{ url_for('tarifications') }}" class="btn btn-secondary">Retour</a>
            </div>
        </div>
    </form>
{% endblock %}
