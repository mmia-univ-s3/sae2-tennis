{% extends "base.html" %}

{% block main %}
    <body>
        <h1>Ajout d'une sous-catégorie</h1>
        <form action="{{ url_for('tarifications_souscategorie_ajout', id_cat=id_cat) }}" method="post" class="form-horizontal mb-3">
            {{ form.hidden_tag() }}
            <div class="form-group mb-3">
                <label for="intituleCat" class="col-sm-2 control-label">{{ form.intituleCat.label }}</label>
                <div class="col-sm-10">
                    {{ form.intituleCat(size=50, class_="form-control") }}
                </div>
            </div>
            <div class="form-group">
                <div class="col-sm-offset-2 col-sm-10">
                    <input type="submit" value="Valider" class="btn btn-success">
                    <a href="{{ url_for('tarifications_tarif_ajout', id_cat=id_cat) }}" class="btn btn-secondary">Retour</a>
                </div>
            </div>
        </form>
    </body>
{% endblock %}
