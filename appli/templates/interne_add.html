{% extends "base.html" %}

{% block main %}
    <h1>Ajout d'un tournoi interne</h1>

    <form action="{{ url_for('interne_add') }}" method="post" class="form-horizontal mb-3"
          enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="titre" class="col-sm-10 control-label">{{ form.titre.label }}</label>
            <div class="col-sm-10">
                {{ form.titre(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="date" class="col-sm-10 control-label">{{ form.date.label }}</label>
            <div class="col-sm-10">
                {{ form.date(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="col-sm-offset-2 col-sm-10">
            <input type="submit" value="Sauvegarder" class="btn btn-success">
            <a href="{{ url_for('internes') }}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
{% endblock %}
