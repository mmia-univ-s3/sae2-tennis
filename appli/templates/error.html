<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Erreur {{error_code}} - Stade Poitevin Tennis</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
</head>
<body>
    <div class="container pt-5">
      <div class="card" style="max-width: 25rem; margin-left: auto; margin-right: auto;">
        <div class="card-body" style="text-align: center;">
          <h1 class="card-title mb-3">{{ error_code }}</h1>
          <h5 class="card-text mb-4">{{ error_message }}</h5>
          <a href="{{ url_for('index') }}">Retourner à l'accueil</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
