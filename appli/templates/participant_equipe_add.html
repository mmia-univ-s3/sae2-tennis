{% extends "base.html" %}

{% block main %}
    <h1>Ajout d'une équipe pour {{ championnat.titre }}</h1>
    <form action="{{ url_for('participant_equipe_add', id_championnat=championnat.id) }}"
          method="post"
          class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="equipe" class="col-sm-2 control-label">{{ form.equipe.label }}</label>
            <div class="col-sm-10">
                {{ form.equipe(class_="form-select") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="rang" class="col-sm-2 control-label">{{ form.rang.label }}</label>
            <div class="col-sm-10">
                {{ form.rang(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group mb-3">
            <label for="poule" class="col-sm-2 control-label">{{ form.poule.label }}</label>
            <div class="col-sm-10">
                {{ form.poule(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Ajouter" class="btn btn-success">
                <a href="{{ url_for('tournoi', type_tournoi='equipe', id_championnat=championnat.id) }}" class="btn btn-secondary">Annuler</a>
            </div>
        </div>
    </form>
{% endblock %}
