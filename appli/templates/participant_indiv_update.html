{% extends "base.html" %}

{% block main %}
    <h1>Modification du participant {{ joueur.prenom }} {{ joueur.nom }} pour {{ championnat.titre }}</h1>
    <form action="{{ url_for('participant_indiv_update', id_championnat=championnat.id, id_joueur=joueur.id) }}"
          method="post"
          class="form-horizontal mb-3">
        {{ form.hidden_tag() }}
        <div class="form-group mb-3">
            <label for="rang" class="col-sm-2 control-label">{{ form.rang.label }}</label>
            <div class="col-sm-10">
                {{ form.rang(size=50, class_="form-control") }}
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="submit" value="Modifier" class="btn btn-warning">
                <a href="{{ url_for('tournoi', type_tournoi='individuel', id_championnat=championnat.id) }}" class="btn btn-secondary">Annuler</a>
            </div>
        </div>
    </form>
{% endblock %}
